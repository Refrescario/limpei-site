<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Icon background -->
  <rect x="0" y="10" width="100" height="100" rx="22" fill="#1A2B4A"/>

  <!-- Drop shape -->
  <path d="M50 22C50 22 24 42 24 59C24 73.4 35.2 85 50 85C64.8 85 76 73.4 76 59C76 42 50 22 50 22Z"
        fill="url(#dropGrad)"/>

  <!-- Highlight on drop -->
  <ellipse cx="41" cy="45" rx="6" ry="10" fill="white" fill-opacity="0.22"
           transform="rotate(-20 41 45)"/>

  <defs>
    <linearGradient id="dropGrad" x1="50" y1="22" x2="50" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14A49A"/>
      <stop offset="100%" stop-color="#0D7377"/>
    </linearGradient>
  </defs>

  <!-- Logotype text: "Limp" in navy, "ei" in teal -->
  <text x="118" y="76"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="62"
        letter-spacing="-1.5"
        fill="#1A2B4A">Limp</text>

  <text x="308" y="76"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="800"
        font-size="62"
        letter-spacing="-1.5"
        fill="#14A49A">ei</text>

  <!-- Tagline -->
  <text x="118" y="97"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="500"
        font-size="13.5"
        letter-spacing="0.08em"
        fill="#64748B">SERVIÇOS DE LIMPEZA PROFISSIONAL</text>

</svg>
